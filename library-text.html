// ===== READ URL PARAMETERS =====
const params    = new URLSearchParams(window.location.search);
const deityKey  = params.get('deity')   || 'shiva';
const contentKey= params.get('content') || 'chalisa';

const deityData   = textDatabase[deityKey];
const contentData = deityData ? deityData[contentKey] : null;

// ===== RENDER PAGE =====
if (contentData) {
  document.getElementById('contentEyebrow').textContent = contentData.icon + ' ' + deityData.name;
  document.getElementById('contentTitle').textContent   = contentData.title;
  document.getElementById('bcDeityLink').textContent    = deityData.name;
  document.getElementById('bcDeityLink').href           = `library-deity.html?deity=${deityKey}`;
  document.getElementById('bcContent').textContent      = contentData.titleEn;
  document.title = contentData.titleEn + ' — श्री सिद्धेश्वर नाथ मंदिर';

  document.getElementById('hindiContent').textContent    = contentData.hindi;
  document.getElementById('maithiliContent').textContent = contentData.maithili;

  document.getElementById('backBtn').href  = `library-deity.html?deity=${deityKey}`;
  document.getElementById('backBtn2').href = `library-deity.html?deity=${deityKey}`;
} else {
  document.getElementById('contentTitle').textContent = 'Content Coming Soon';
  document.getElementById('hindiContent').textContent = 'यह सामग्री जल्द जोड़ी जाएगी 🙏';
  document.getElementById('backBtn').href  = 'library.html';
  document.getElementById('backBtn2').href = 'library.html';
}

// ===== LANGUAGE SWITCH =====
function setLang(lang, el) {
  document.querySelectorAll('.lang-sw-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('hindiText').style.display    = (lang === 'hindi')    ? 'block' : 'none';
  document.getElementById('maithiliText').style.display = (lang === 'maithili') ? 'block' : 'none';
}
