          meaning: `जय गणेश गिरिजा सुवन...: माता पार्वती के पुत्र श्री गणेश जी की जय हो, जो सभी मंगलों के मूल और परम ज्ञानी हैं। अयोध्यादास जी कहते हैं कि हे प्रभु! आप मुझे निर्भयता का वरदान दें।

नन्दि गणेश सोहैं तहँ कैसे...: उनके पास नंदी और गणेश जी इस प्रकार सुशोभित हैं, जैसे सरोवर के बीच में कमल खिले हों।

कार्तिक श्याम और गणराऊ...: स्वामी कार्तिकेय और अन्य गणराजों की इस सुंदर छवि का वर्णन किसी से भी करते नहीं बनता।

देवन जबहीं जाय पुकारा...: देवताओं ने जब भी संकट में आकर पुकारा, हे प्रभु! आपने तुरंत उनके दुखों का निवारण किया।

किया उपद्रव तारक भारी...: जब तारकासुर नाम के राक्षस ने भारी उपद्रव मचाया और देवताओं ने आपसे रक्षा की प्रार्थना की;

तुरत षडानन आप पठायो...: तब आपने तुरंत छह मुखों वाले स्वामी कार्तिकेय (षडानन) को भेजा, जिन्होंने पलक झपकते ही उस राक्षस को मार गिराया।

आप जलन्धर असुर संहारा...: आपने ही जलंधर नाम के असुर का वध किया, आपका यह सुयश पूरे संसार में प्रसिद्ध है।

त्रिपुरासुर सन युद्ध मचाई...: जब त्रिपुरासुर राक्षस से युद्ध हुआ, तब आपने सब पर कृपा करके संसार को उसके आतंक से बचाया।

किया तपहिं भागीरथ भारी...: जब राजा भागीरथ ने गंगा को पृथ्वी पर लाने के लिए भारी तपस्या की, तब हे पुरारी! आपने उनकी प्रतिज्ञा पूरी की (और गंगा को अपनी जटाओं में रोका)।

दानिन महँ तुम सम कोउ नाहीं...: दयानियों और दानवीरों में आपके समान कोई दूसरा नहीं है, इसलिए सेवक हमेशा आपकी स्तुति करते हैं।

वेद नाम महिमा तव गाई...: वेदों ने भी आपकी महिमा का गान किया है, लेकिन वे भी आपके अनादि और अकथनीय भेद को पूरी तरह नहीं पा सके।

प्रकटे उदधि मन्थन के ज्वाला...: समुद्र मंथन के समय जब हलाहल विष की भयानक ज्वाला निकली, जिससे देव और असुर दोनों व्याकुल हो उठे;

कीन्ही दया तहँ करी सहाई...: तब आपने दया करके उस विष को पी लिया और सहायता की, जिससे आपका नाम 'नीलकंठ' पड़ा।

पूजन रामचन्द्र जब कीन्हा...: जब भगवान श्रीराम ने लंका विजय से पहले आपका पूजन किया, तब आपकी कृपा से उन्होंने लंका जीती और विभीषण को वहां का राजा बनाया।

सहस कमल में हो रहे धारी...: जब श्रीराम सहस्र (हजार) कमल के फूलों से आपका पूजन कर रहे थे, तब हे पुरारी! आपने उनकी परीक्षा ली (और एक कमल छिपा दिया)।

एक कमल प्रभु राखेउ जोई...: जब एक कमल कम पड़ गया, तो श्रीराम ने अपने कमल जैसे नेत्र (कमल नयन) ही आपको अर्पित करने चाहे।

कठिन भक्ति देखी प्रभु शंकर...: श्रीराम की ऐसी कठिन और सच्ची भक्ति देखकर आप प्रसन्न हो गए और उन्हें इच्छित वरदान दिया।

त्राहि त्राहि मैं नाथ पुकारो...: हे नाथ! मैं रक्षा के लिए आपको पुकार रहा हूं, इस कठिन समय में आकर मेरा उद्धार कीजिए।

1. 'न' अक्षर का श्लोक:

नागेन्द्रहाराय त्रिलोचनाय भस्माङ्गरागाय महेश्वराय।

नित्याय शुद्धाय दिगम्बराय तस्मै 'न'काराय नमः शिवाय॥

अर्थ: जिनके गले में सांपों का राजा (नागेन्द्र) हार के रूप में है, जिनके तीन नेत्र हैं, जो अपने पूरे शरीर पर भस्म (राख) लगाते हैं, जो महान ईश्वर (महेश्वर) हैं, जो नित्य (शाश्वत) और परम शुद्ध हैं, और जो चारों दिशाओं को ही अपना वस्त्र मानते हैं (दिगंबर हैं), उस 'न' अक्षर स्वरूप भगवान शिव को मेरा प्रणाम है।

2. 'म' अक्षर का श्लोक:

मन्दाकिनीसलिलचन्दनचर्चिताय नन्दीश्वरप्रमथनाथमहेश्वराय।

मन्दारपुष्पबहुपुष्पसुपूजिताय तस्मै 'म'काराय नमः शिवाय॥

अर्थ: जिनकी गंगा जी (मंदाकिनी) के पवित्र जल और चंदन से अर्चना की गई है, जो नंदी और प्रमथ गणों के स्वामी हैं, जिनकी पूजा मन्दार और अन्य कई दिव्य फूलों से की जाती है, उस 'म' अक्षर स्वरूप भगवान शिव को मेरा प्रणाम है।

3. 'शि' अक्षर का श्लोक:

शिवाय गौरीवदनाब्जबृन्दसूर्याय दक्षाध्वरनाशकाय।

श्रीनीलकण्ठाय वृषध्वजाय तस्मै 'शि'काराय नमः शिवाय॥

अर्थ: जो स्वयं कल्याणकारी (शिव) हैं, जो माता पार्वती (गौरी) के कमल जैसे मुख को खिलाने के लिए सूर्य के समान हैं (अर्थात जिन्हें देखकर माता पार्वती प्रसन्न होती हैं), जिन्होंने राजा दक्ष के अहंकारी यज्ञ का नाश किया था, जिनका कंठ नीला है (नीलकंठ) और जिनके ध्वज पर बैल (वृष) का चिह्न है, उस 'शि' अक्षर स्वरूप भगवान शिव को मेरा प्रणाम है।

4. 'वा' अक्षर का श्लोक:

वसिष्ठकुम्भोद्भवगौतमार्यमुनीन्द्रदेवार्चितशेखराय।

चन्द्रार्कवैश्वानरलोचनाय तस्मै 'वा'काराय नमः शिवाय॥

अर्थ: वसिष्ठ, अगस्त्य (कुम्भोद्भव) और गौतम जैसे महान ऋषियों तथा देवताओं द्वारा जिनके मस्तक की पूजा की जाती है, और सूर्य, चंद्रमा तथा अग्नि (वैश्वानर) जिनकी तीन आंखें हैं, उस 'वा' अक्षर स्वरूप भगवान शिव को मेरा प्रणाम है।

// ===== READ URL PARAMETERS =====
const params     = new URLSearchParams(window.location.search);
const deityKey   = params.get('deity')   || 'shiva';
const contentKey = params.get('content') || 'chalisa';

const deityData   = textDatabase[deityKey];
const contentData = deityData ? deityData[contentKey] : null;

// ===== RENDER PAGE =====
if (contentData) {
  document.getElementById('contentEyebrow').textContent = contentData.icon + ' ' + deityData.name;
  document.getElementById('contentTitle').textContent   = contentData.title;
  document.getElementById('bcDeityLink').textContent    = deityData.name;
  document.getElementById('bcDeityLink').href           = `library-deity.html?deity=${deityKey}`;
  document.getElementById('bcContent').textContent      = contentData.titleEn;
  document.title = contentData.titleEn + ' — श्री सिद्धेश्वर नाथ मंदिर';

  const container = document.getElementById('versesContainer');
  container.innerHTML = '';

  if (contentData.verses) {
    // ✅ NEW FORMAT — verse-by-verse with अर्थ button
    contentData.verses.forEach((verse, i) => {
      const block = document.createElement('div');
      block.className = 'verse-block';
      block.innerHTML = `
        <div class="verse-text hindi-text">${verse.hindi}</div>
        <div class="verse-text maithili-text" style="display:none;">${verse.maithili}</div>
        <button class="arth-btn" onclick="toggleArth(${i})">अर्थ देखें</button>
      `;
      container.appendChild(block);
    });
    currentVerses = contentData.verses;
  } else {
    // ⚠️ OLD FORMAT — abhi tak convert nahi hua, single block dikhega (bina arth button)
    container.innerHTML = `
      <div class="verse-text hindi-text" style="white-space:pre-line;">${contentData.hindi}</div>
      <div class="verse-text maithili-text" style="white-space:pre-line;display:none;">${contentData.maithili}</div>
    `;
  }

  document.getElementById('backBtn').href  = `library-deity.html?deity=${deityKey}`;
  document.getElementById('backBtn2').href = `library-deity.html?deity=${deityKey}`;
} else {
  document.getElementById('contentTitle').textContent = 'Content Coming Soon';
  document.getElementById('versesContainer').innerHTML = '<p style="text-align:center;">यह सामग्री जल्द जोड़ी जाएगी 🙏</p>';
  document.getElementById('backBtn').href  = 'library.html';
  document.getElementById('backBtn2').href = 'library.html';
}

// ===== LANGUAGE SWITCH =====
function setLang(lang, el) {
  document.querySelectorAll('.lang-sw-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.hindi-text').forEach(e => e.style.display    = (lang === 'hindi')    ? 'block' : 'none');
  document.querySelectorAll('.maithili-text').forEach(e => e.style.display = (lang === 'maithili') ? 'block' : 'none');
}

// ===== ARTH (MEANING) SIDE PANEL =====


function toggleArth(i) {
  const verse = currentVerses[i];
  document.getElementById('arthPanelBody').textContent = verse.meaning || 'अर्थ अभी जोड़ा नहीं गया है।';
  document.getElementById('arthPanel').classList.add('open');
  document.getElementById('arthOverlay').classList.add('open');
}

function closeArth() {
  document.getElementById('arthPanel').classList.remove('open');
  document.getElementById('arthOverlay').classList.remove('open');
}
