<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ===== DEITY DATA (only Shiva for now) =====
const deityInfo = {
  shiva: {
    name: 'भगवान शिव',
    nameEn: 'LORD SHIVA',
    emoji: '🕉️',
    badge: '॥ हर हर महादेव ॥',
    contents: [
      { id:'chalisa',          icon:'📖', title:'शिव चालीसा',         titleEn:'Shiv Chalisa' },
      { id:'aarti',            icon:'🙏', title:'शिव आरती',           titleEn:'Shiv Aarti' },
      { id:'mantra',           icon:'🔱', title:'शिव मंत्र',           titleEn:'Shiv Mantra' },
      { id:'mahamrityunjaya',  icon:'🌙', title:'महामृत्युंजय मंत्र',  titleEn:'Mahamrityunjaya' },
      { id:'panchakshari',     icon:'🕉️', title:'पंचाक्षरी मंत्र',     titleEn:'Panchakshari Mantra' },
      { id:'stotram',          icon:'📿', title:'शिव स्तोत्रम्',       titleEn:'Shiv Stotram' },
      { id:'rudrashtakam',     icon:'🔥', title:'रुद्राष्टकम्',        titleEn:'Rudrashtakam' },
    
    ]
  },
  hanuman: {
    name: 'हनुमान जी',
    nameEn: 'HANUMAN JI',
    emoji: '🐒',
    badge: '॥ जय बजरंगबली ॥',
    contents: [
      { id:'chalisa', icon:'📖', title:'हनुमान चालीसा',   titleEn:'Hanuman Chalisa' },
      { id:'aarti',   icon:'🙏', title:'हनुमान आरती',     titleEn:'Hanuman Aarti' },
      { id:'mantra',  icon:'🔱', title:'हनुमान मंत्र',     titleEn:'Hanuman Mantra' },
      { id:'bajrang-baan', icon:'⚡', title:'बजरंग बाण',  titleEn:'Bajrang Baan' },
    ]
  },
  durga: {
    name: 'माँ दुर्गा',
    nameEn: 'MAA DURGA',
    emoji: '🌺',
    badge: '॥ जय माता दी ॥',
    contents: [
      { id:'chalisa', icon:'📖', title:'दुर्गा चालीसा', titleEn:'Durga Chalisa' },
      { id:'aarti',   icon:'🙏', title:'दुर्गा आरती',   titleEn:'Durga Aarti' },
      { id:'mantra',  icon:'🔱', title:'दुर्गा मंत्र',   titleEn:'Durga Mantra' },
      { id:'kavach',  icon:'🛡️', title:'दुर्गा कवच',    titleEn:'Durga Kavach' },
    ]
  }
};
// ===== GET DEITY FROM URL =====
const params = new URLSearchParams(window.location.search);
const deityKey = params.get('deity') || 'shiva';
const deity = deityInfo[deityKey];

// ===== RENDER PAGE =====
if (deity) {
  document.getElementById('heroBadge').textContent = deity.badge;
  document.getElementById('heroTitle').textContent  = deity.emoji + ' ' + deity.name;
  document.getElementById('bcDeity').textContent    = deity.nameEn;
  document.title = deity.nameEn + ' — श्री सिद्धेश्वर नाथ मंदिर';
  document.getElementById('sectionHeading').innerHTML = deity.name + ' — <span>सामग्री चुनें</span>';

  const grid = document.getElementById('contentGrid');
  deity.contents.forEach(item => {
    const link = document.createElement('a');
    link.href = `library-text.html?deity=${deityKey}&content=${item.id}`;
    link.className = 'deity-card';
    link.innerHTML = `
      <span class="deity-emoji">${item.icon}</span>
      <div class="deity-name-hi">${item.title}</div>
      <div class="deity-name-en">${item.titleEn.toUpperCase()}</div>
    `;
    grid.appendChild(link);
  });
} else {
  document.getElementById('contentGrid').innerHTML = '<p style="color:#aaa;text-align:center;">Deity data coming soon</p>';
}
</script>
