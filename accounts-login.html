    <h1>🔐 Accounts Portal</h1>

<!-- LOGIN/SIGNUP CARD -->
<section class="login-wrap">
  <div class="container">
    <div class="login-card">

      <div class="toggle-tabs">
        <button class="toggle-tab active" onclick="showTab('login', this)">Login</button>
        <button class="toggle-tab" onclick="showTab('signup', this)">Sign Up</button>
      </div>

      <div id="msgBox" class="msg-box"></div>

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <label class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="yourname@email.com">
        <label class="form-label">Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
        <button class="submit-btn" id="loginBtn" onclick="doLogin()">Login</button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signupForm" style="display:none;">
        <label class="form-label">पूरा नाम — Full Name</label>
        <input type="text" id="signupName" class="form-control" placeholder="आपका नाम">
        <label class="form-label">Email</label>
        <input type="email" id="signupEmail" class="form-control" placeholder="yourname@email.com">
        <label class="form-label">Password (min 6 characters)</label>
        <input type="password" id="signupPassword" class="form-control" placeholder="••••••••">
        <button class="submit-btn" id="signupBtn" onclick="doSignup()">Create Account</button>
      </div>

      <a href="index.html" class="back-link">‹ Back to Home</a>
    </div>
  </div>
</section>

<!-- ===== FIREBASE SDK (CDN version — no build tools needed) ===== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // Firebase config (same as firebase-config.js)
  const firebaseConfig = {
    apiKey: "AIzaSyCJBHAyw1mJAzk_ZxtRkdhk4UjW65Zehac",
    authDomain: "sidheswar-nath-mandir.firebaseapp.com",
    projectId: "sidheswar-nath-mandir",
    storageBucket: "sidheswar-nath-mandir.firebasestorage.app",
    messagingSenderId: "881069210651",
    appId: "1:881069210651:web:7afffc665f07eb8f1e4cbe"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ===== TAB SWITCH =====
  window.showTab = function(tab, el) {
    document.querySelectorAll('.toggle-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('loginForm').style.display  = (tab === 'login')  ? 'block' : 'none';
    document.getElementById('signupForm').style.display = (tab === 'signup') ? 'block' : 'none';
    hideMsg();
  };

  function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg-box ' + (type === 'error' ? 'msg-error' : 'msg-success');
    box.style.display = 'block';
  }
  function hideMsg() {
    document.getElementById('msgBox').style.display = 'none';
  }

  // ===== SIGNUP =====
  window.doSignup = function() {
    const name     = document.getElementById('signupName').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    if (!name || !email || !password) {
      showMsg('कृपया सभी fields भरें', 'error');
      return;
    }
    if (password.length < 6) {
      showMsg('Password kam se kam 6 characters ka hona chahiye', 'error');
      return;
    }

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        // Save extra info (name) in Firestore
        return setDoc(doc(db, "users", user.uid), {
          name: name,
          email: email,
          createdAt: new Date().toISOString()
        });
      })
      .then(() => {
        showMsg('✅ Account ban gaya! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'accounts.html'; }, 1200);
      })
      .catch((error) => {
        btn.disabled = false;
        btn.textContent = 'Create Account';
        if (error.code === 'auth/email-already-in-use') {
          showMsg('Ye email pehle se registered hai. Login karo.', 'error');
        } else if (error.code === 'auth/invalid-email') {
          showMsg('Email sahi format mein nahi hai', 'error');
        } else {
          showMsg('Error: ' + error.message, 'error');
        }
      });
  };

  // ===== LOGIN =====
  window.doLogin = function() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      showMsg('कृपया Email aur Password bharein', 'error');
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        showMsg('✅ Login successful! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'accounts.html'; }, 1000);
      })
      .catch((error) => {
        btn.disabled = false;
        btn.textContent = 'Login';
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
          showMsg('Email ya Password galat hai', 'error');
        } else if (error.code === 'auth/user-not-found') {
          showMsg('Ye email registered nahi hai. Sign Up karo.', 'error');
        } else {
          showMsg('Error: ' + error.message, 'error');
        }
      });
  };
</script>
